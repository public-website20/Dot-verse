<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DotVerse - بازی نقطه و خط</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="container">
        <!-- هدر بالای صفحه -->
        <header class="game-header">
            <h1 class="game-title">DotVerse</h1>
            <div class="menu-btn" id="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </header>

        <!-- پنل کشویی بازیکنان و دکمه اتمام عضوگیری -->
        <div class="drawer-overlay" id="drawer-overlay"></div>
        <div class="side-drawer" id="side-drawer">
            <div class="drawer-header">
                <h3>👥 بازیکنان و امتیازات (<span id="player-count">0</span>/20)</h3>
                <span class="close-btn" id="drawer-close">✕</span>
            </div>
            <div class="players-list" id="players-list">
                <!-- لیست بازیکنان -->
            </div>
            <!-- دکمه اتمام عضوگیری برای سازنده -->
            <div class="drawer-footer" id="drawer-footer" style="padding: 15px; text-align: center;">
                <button class="start-game-modal-btn" id="admin-finish-join-btn" style="display: none; width: 100%; background-color: #f59e0b;">اتمام عضوگیری و تنظیمات ⚙️</button>
            </div>
        </div>

        <!-- پیام اعلان نوبت بازیکن -->
        <div class="turn-banner" id="turn-banner">در انتظار شروع بازی و عضوگیری...</div>

        <!-- کانتینر اصلی زمین بازی -->
        <div class="board-wrapper">
            <div id="board-container"></div>
        </div>

        <!-- تایمر شناور روی صفحه -->
        <div class="floating-timer" id="floating-timer">⏳ زمان</div>

        <!-- مدال اولیه ورود به اتاق (ساخت و پیوستن) -->
        <div class="overlay" id="welcome-overlay">
            <div class="welcome-modal">
                <h2>🎮 اتاق بازی DotVerse</h2>
                <p>لطفاً اتاق جدید بسازید یا به اتاق دوستانتان بپیوندید:</p>
                
                <button class="start-game-modal-btn" id="create-room-btn">ساخت اتاق جدید 🛠️</button>
                <button class="start-game-modal-btn" id="join-room-btn" style="background-color: #28a745; margin-top: 15px;">پیوستن به بازی 🤝</button>
            </div>
        </div>

        <!-- مدال تنظیمات نهایی (ابعاد و زمان) که بعد از اتمام عضوگیری باز می‌شود -->
        <div class="overlay hidden" id="settings-overlay">
            <div class="welcome-modal">
                <h2>⚙️ تنظیمات نهایی بازی</h2>
                <p>با توجه به تعداد بازیکنان، مشخصات بازی را انتخاب کنید:</p>
                
                <!-- بخش انتخاب ابعاد شبکه (پویا) -->
                <div class="form-group" style="margin: 15px 0; text-align: right;">
                    <label for="grid-size-select" style="display: block; margin-bottom: 5px; font-weight: bold;">انتخاب ابعاد شبکه:</label>
                    <select id="grid-size-select" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-family: inherit; background: #1e293b; color: #fff;">
                        <!-- به‌صورت پویا با توجه به تعداد بازیکنان پر می‌شود -->
                    </select>
                </div>

                <!-- بخش انتخاب حالت زمان بازی -->
                <div class="form-group" style="margin: 15px 0; text-align: right;">
                    <label for="timer-mode-select" style="display: block; margin-bottom: 5px; font-weight: bold;">حالت زمان نوبت:</label>
                    <select id="timer-mode-select" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-family: inherit; background: #1e293b; color: #fff;">
                        <option value="none">بدون زمان (آزاد)</option>
                        <option value="2">۲ دقیقه</option>
                        <option value="3">۳ دقیقه</option>
                        <option value="5" selected>۵ دقیقه</option>
                        <option value="7">۷ دقیقه</option>
                    </select>
                </div>

                <button class="start-game-modal-btn" id="admin-start-btn" style="background-color: #28a745; margin-top: 10px;">شروع نهایی بازی 🚀</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
