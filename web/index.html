<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DotVerse - بازی نقطه و خط</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <!-- هدر بالای صفحه شامل عنوان و دکمه همبرگری (سه خط) در سمت راست -->
        <header class="game-header">
            <h1 class="game-title">DotVerse</h1>
            <div class="menu-btn" id="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </header>

        <!-- پنل کشویی بازیکنان و امتیازات -->
        <div class="drawer-overlay" id="drawer-overlay"></div>
        <div class="side-drawer" id="side-drawer">
            <div class="drawer-header">
                <h3>👥 بازیکنان و امتیازات (<span id="player-count">0</span>/20)</h3>
                <span class="close-btn" id="drawer-close">✕</span>
            </div>
            <div class="players-list" id="players-list">
                <!-- لیست بازیکنان به‌صورت پویا پر می‌شود -->
            </div>
            <!-- دکمه شروع بازی برای سازنده (فقط وقتی وارد پنل شود نمایش داده می‌شود) -->
            <div class="drawer-footer" id="drawer-footer" style="padding: 15px; text-align: center;">
                <button class="start-game-modal-btn" id="admin-start-btn" style="display: none; width: 100%;">اتمام عضوگیری و شروع بازی 🚀</button>
            </div>
        </div>

        <!-- پیام اعلان نوبت بازیکن -->
        <div class="turn-banner" id="turn-banner">در انتظار شروع بازی و عضوگیری...</div>

        <!-- کانتینر اصلی زمین بازی -->
        <div class="board-wrapper">
            <div id="board-container"></div>
        </div>

        <!-- تایمر شناور روی صفحه -->
        <div class="floating-timer" id="floating-timer">⏳ 5s</div>

        <!-- کادر ساخت بازی، انتخاب ابعاد و پیوستن به بازی -->
        <div class="overlay" id="welcome-overlay">
            <div class="welcome-modal">
                <h2>🎮 تنظیمات بازی DotVerse</h2>
                <p>لطفاً مشخصات بازی را انتخاب کرده یا به اتاق بپیوندید:</p>
                
                <!-- بخش انتخاب ابعاد صفحه -->
                <div class="form-group" style="margin: 15px 0; text-align: right;">
                    <label for="grid-size-select" style="display: block; margin-bottom: 5px; font-weight: bold;">انتخاب ابعاد شبکه:</label>
                    <select id="grid-size-select" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-family: inherit; background: #1e293b; color: #fff;">
                        <option value="3">کوچک (۳ در ۳)</option>
                        <option value="5" selected>متوسط (۵ در ۵)</option>
                        <option value="7">بزرگ (۷ در ۷)</option>
                    </select>
                </div>

                <!-- بخش انتخاب حالت زمان بازی -->
                <div class="form-group" style="margin: 15px 0; text-align: right;">
                    <label for="timer-mode-select" style="display: block; margin-bottom: 5px; font-weight: bold;">حالت زمان نوبت:</label>
                    <select id="timer-mode-select" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-family: inherit; background: #1e293b; color: #fff;">
                        <option value="none">بدون زمان (نامحدود)</option>
                        <option value="2">زمان‌دار (۲ ثانیه)</option>
                        <option value="3">زمان‌دار (۳ ثانیه)</option>
                        <option value="5" selected>زمان‌دار (۵ ثانیه)</option>
                        <option value="7">زمان‌دار (۷ ثانیه)</option>
                    </select>
                </div>

                <!-- دکمه‌های اکشن (ساخت / پیوستن) -->
                <button class="start-game-modal-btn" id="create-room-btn">ساخت اتاق جدید 🛠️</button>
                <button class="start-game-modal-btn" id="join-room-btn" style="background-color: #28a745; margin-top: 10px;">پیوستن به بازی 🤝</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
