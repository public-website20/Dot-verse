<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DotVerse - بازی نقطه و خط</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="container">
        <!-- هدر بالای صفحه -->
        <header class="game-header">
            <h1 class="game-title">DotVerse</h1>
            <div class="menu-btn" id="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </header>

        <!-- پنل کشویی بازیکنان و امتیازات -->
        <div class="drawer-overlay" id="drawer-overlay"></div>
        <div class="side-drawer" id="side-drawer">
            <div class="drawer-header">
                <h3>👥 بازیکنان و امتیازات (<span id="player-count">0</span>)</h3>
                <span class="close-btn" id="drawer-close">✕</span>
            </div>
            <div class="players-list" id="players-list">
                <!-- لیست بازیکنان به صورت پویا اینجا قرار می‌گیرد -->
            </div>
        </div>

        <!-- پیام اعلان نوبت بازیکن -->
        <div class="turn-banner" id="turn-banner">در انتظار نوبت بازی...</div>

        <!-- کانتینر اصلی زمین بازی -->
        <div class="board-wrapper">
            <div id="board-container"></div>
        </div>

        <!-- تایمر شناور روی صفحه -->
        <div class="floating-timer" id="floating-timer">⏳ زمان: --</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
